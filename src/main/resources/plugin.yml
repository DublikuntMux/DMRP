name: DMRP
version: "${version}"
api-version: "${apiVersion}"
main: com.dublikunt.rp.DMRP
load: POSTWORLD

prefix: DMRP
description: "Plugin that add new role play commands and mechanics to you server."
website: https://github.com/DublikuntMux/DMRP
authors: [ "Dublikunt Max" ]

dependencies: [packetevents]
softDepends: [PlaceholderAPI]

commands:
  rp-reload:
    description: Reloads the DMRP plugin
    permission: dmrp.command.reload
  coinflip:
    description: Flips a coin
    permission: dmrp.command.coinflip
  try:
    description: Try to do something
    permission: dmrp.command.try
  dice:
    description: Rolls a dice
    permission: dmrp.command.dice
  leash:
    description: Leash a player
    permission: dmrp.leash.use
  lockinv:
    description: Lock a player's inventory
    permission: dmrp.lock.use

permissions:
  dmrp.lock.admin:
    description: Gives access to unlock inventories that you don't own
    default: op
  dmrp.lock.can:
    description: Gives access to can be inventory locked
    default: true
  dmrp.lock.use:
    description: Gives access to lock players inventories
    default: op

  dmrp.leash.admin:
    description: Gives access to unleash players that you don't own
    default: op
  dmrp.leash.can:
    description: Gives access to can be leashed
    default: true
  dmrp.leash.use:
    description: Gives access to leash players
    default: op

  dmrp.command.reload:
    description: Has permission to reload plugin
    default: op
  dmrp.command.try:
    description: Has permission to try command
    default: true
  dmrp.command.dice:
    description: Has permission to dice command
    default: true
  dmrp.command.coinflip:
    description: Has permission to coin flip command
    default: true
  dmrp.command.lockinv:
    description: Has permission to lock inventory command
    default: op
  dmrp.command.leash:
    description: Has permission to leash player command
    default: op

libraries:
  - org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlinVersion}
