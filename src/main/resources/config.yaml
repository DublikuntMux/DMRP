# DO NOT CHANGE THIS MANUALLY
# Configuration schema version.
# Older files without this key are treated as version 1.
config-version: 1

# Command message hearing distance in blocks. Must be >= 0.
hear_distance: 30
# Check for updates on startup. Changes take effect on the next server restart.
update: true

# /try success chance as a percentage, from 0 to 100.
# The existing key spelling is retained for compatibility.
success_change: 50

# Maximum dice per roll, from 1 to 10000.
max_dices: 100
# Maximum sides per die, from 1 to 100000.
max_sides: 255

# Maximum distance in blocks for locking another player's inventory. Must be >= 0.
lock_distance: 5
# Non-air item material used to lock players.
# CHAIN and IRON_CHAIN (its name since Minecraft 1.21.9) both work on every server version.
lock_item: "IRON_CHAIN"

# Maximum leash distance in blocks. Must be >= 0.
leash_distance: 15
# Client leash-position synchronization interval in server ticks, from 1 to 200.
# 20 ticks = 1 second at normal server tick rate.
leash_sync_rate: 2
# Non-air item material used to leash players.
leash_item: "LEAD"
